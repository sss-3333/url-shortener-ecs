<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 16px; color: #232f3e; }
    input, button { font-size: 16px; padding: 10px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
    button { width: 100%; background: #ff9900; border: 0; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 16px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input id="url" type="url" placeholder="https://example.com/a/very/long/link">
  <button onclick="shorten()">Shorten</button>
  <p id="result"></p>

  <script>

    async function shorten() {
      const url = document.getElementById("url").value.trim();
      const out = document.getElementById("result");
      if (!url) { out.textContent = "Enter a URL first."; return; }

      const res = await fetch("/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      if (!res.ok) { out.textContent = "Something went wrong."; return; }

      const data = await res.json();
      const link = location.origin + "/" + data.short;
      out.innerHTML = `Short link: <a href="${link}" target="_blank">${link}</a>`;
    }
  </script>
</body>
</html>
